name: package-macos

on:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        required: false
        default: main
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        default: "0.0.0"
      nucleus_ref:
        description: "NucleusFramework/Nucleus ref"
        type: string
        default: main

permissions:
  contents: read

jobs:
  package:
    name: package-macos
    # Apple Silicon  for now
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: NucleusFramework/Nucleus
          ref: ${{ inputs.nucleus_ref || 'main' }}
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Import signing certificate into a temporary keychain
        env:
          APPLE_SIGNING_P12_BASE64: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_SIGNING_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Make it visible to codesign without replacing the runner's default keychain
          # search path entirely.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$CERT_PATH"
          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write notarization API key to disk
        env:
          APPLE_NOTARIZATION_API_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notarization-key.p8"
          echo -n "$APPLE_NOTARIZATION_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          echo "APPLE_NOTARIZATION_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Package, sign, and notarize DMG (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_API_KEY_ID }}
          APPLE_NOTARIZATION_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_API_ISSUER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:notarizeGraalvmDmg --no-daemon --stacktrace \
            -Papp.variant=${{ inputs.variant }} \
            -Papp.version=${{ inputs.version }} \
            -Papp.packageVersion=${{ inputs.package_version }}

      - name: Clean up temporary keychain and notarization key
        if: always()
        run: |
          security delete-keychain "$APPLE_SIGNING_KEYCHAIN" 2>/dev/null || true
          rm -f "$APPLE_NOTARIZATION_API_KEY_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macOS-arm64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.dmg
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
