name: publish-chocolatey

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag'
        required: false
        default: 'v1.0.2'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'published' && !github.event.release.prerelease)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          } else {
            $tag = '${{ github.event.inputs.tag_name }}'
          }
          $version = $tag -replace '^v', ''
          Write-Host "Publishing version: $version (tag: $tag)"
          echo "TAG=$tag" >> $env:GITHUB_ENV
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Update version in nuspec
        shell: pwsh
        run: |
          (Get-Content packaging\chocolatey\wgtunnel.nuspec) `
            -replace '<version>.*</version>', "<version>${{ env.VERSION }}</version>" `
            -replace 'PLACEHOLDER_TAG', "${{ env.TAG }}" | `
            Set-Content packaging\chocolatey\wgtunnel.nuspec

      # NOTE: the arm64 filename is assumed to follow the same "-win-<arch>-nsis.exe" pattern
      # the x64 release already uses - unverified until the windows-arm64 packaging leg has
      # actually produced and published a real release asset to check this against.
      - name: Pin installer URLs and checksums (amd64 + arm64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installScript = 'packaging\chocolatey\tools\chocolateyInstall.ps1'
          $content = Get-Content $installScript

          foreach ($pair in @(
            @{ Arch = 'x64';   Placeholder = 'AMD64' },
            @{ Arch = 'arm64'; Placeholder = 'ARM64' }
          )) {
            $url = "https://github.com/wgtunnel/desktop/releases/download/${{ env.TAG }}/wgtunnel-${{ env.VERSION }}-win-$($pair.Arch)-nsis.exe"
            $tempFile = Join-Path $env:RUNNER_TEMP "wgtunnel-installer-$($pair.Arch).exe"
            Invoke-WebRequest -Uri $url -OutFile $tempFile
            $checksum = (Get-FileHash -Path $tempFile -Algorithm SHA256).Hash.ToLower()

            $content = $content `
              -replace "PLACEHOLDER_URL_$($pair.Placeholder)", $url `
              -replace "PLACEHOLDER_CHECKSUM_$($pair.Placeholder)", $checksum
          }

          Set-Content -Path $installScript -Value $content

      - name: Pack and push to Chocolatey
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco pack packaging\chocolatey\wgtunnel.nuspec --outputdirectory .
          choco push wgtunnel.${{ env.VERSION }}.nupkg `
            --source https://push.chocolatey.org/ `
            --api-key $env:CHOCO_API_KEY