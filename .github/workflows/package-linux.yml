name: package-linux

on:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        default: "0.0.0"

permissions:
  contents: read

jobs:
  package:
    name: package-linux
    runs-on: ubuntu-latest
    # Build in a pinned image, not on the runner: GitHub's 26.04 runner uses Ubuntu's amd64v3
    # variant, whose C runtime marks executables as needing x86-64-v3. The image also sets the
    # minimum glibc the app needs.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 120
    steps:
      - name: Install base build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates curl wget unzip zip \
            xz-utils zstd file procps binutils build-essential zlib1g-dev libfreetype-dev \
            libfontconfig1 libgl1

      - uses: actions/checkout@v7.0.1
        with:
          path: desktop
          persist-credentials: false
          submodules: recursive

      - uses: NucleusFramework/Nucleus/.github/actions/setup-nucleus@v2.5.18
        with:
          java-version: "25"
          packaging-tools: "true"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.25"

      - name: Install keyring cross-compile toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Package Linux (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :composeApp:packageGraalvmDeb \
            :composeApp:packageGraalvmRpm \
            :composeApp:packageGraalvmPacman \
            :composeApp:packageGraalvmTar \
            --no-daemon --stacktrace \
            -Papp.variant=${{ inputs.variant }} \
            -Papp.version=${{ inputs.version }} \
            -Papp.packageVersion=${{ inputs.package_version }}

      - name: Check binaries run on baseline x86-64
        working-directory: desktop
        run: |
          fail=0
          for f in composeApp/build/compose/tmp/main/graalvm/nativeCompile/wgtunnel* \
                   daemon/build/compose/tmp/main/graalvm/nativeCompile/wgtunnel-daemon \
                   keyring/tools/keyring-go/out/libkeyring-linux-amd64.so; do
            [ -f "$f" ] || continue
            if readelf -n "$f" | grep -qE 'ISA needed:.*x86-64-v[234]'; then
              echo "::error::$f is marked as needing a newer x86-64 level"; fail=1
            fi
          done
          # Go's runtime picks AVX2 paths at runtime, but cgo's C code must stay baseline.
          if objdump -d keyring/tools/keyring-go/out/libkeyring-linux-amd64.so \
              | awk '/^[0-9a-f]+ <(x_cgo|_cgo|crosscall)/,/^$/' \
              | grep -qE '\s(shrx|shlx|sarx|rorx|andn|bzhi|pdep|pext|mulx|v[a-z0-9]+)\s'; then
            echo "::error::libkeyring cgo code uses instructions newer than baseline x86-64"; fail=1
          fi
          exit $fail

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets-Linux-amd64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.deb
            desktop/composeApp/build/compose/binaries/**/*.rpm
            desktop/composeApp/build/compose/binaries/**/*.pacman
            desktop/composeApp/build/compose/binaries/**/*.pkg.tar.zst
            desktop/composeApp/build/compose/binaries/**/*.tar.gz
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
