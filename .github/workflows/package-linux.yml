name: package-linux

on:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
      nucleus_ref:
        description: "wgtunnel/Nucleus ref (TEMPORARY)"
        type: string
        required: false
        default: fix/apple-notary-recheck
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        default: "0.0.0"
      nucleus_ref:
        description: "wgtunnel/Nucleus ref (TEMPORARY)"
        type: string
        default: fix/apple-notary-recheck

permissions:
  contents: read

jobs:
  package:
    name: package-linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
          submodules: recursive

      # TEMPORARY use fork
      - uses: actions/checkout@v4
        with:
          repository: wgtunnel/Nucleus
          ref: ${{ inputs.nucleus_ref || 'fix/apple-notary-recheck' }}
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          packaging-tools: "true"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      # TEMPORARY for fork build
      - name: Set up JDK 21 (for Nucleus plugin-build script compilation)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # TEMP
      - name: Publish Nucleus plugin fork fix to mavenLocal
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          chmod +x Nucleus/plugin-build/gradlew
          export GITHUB_REF=refs/tags/v2.5.18-notary-fix
          ./Nucleus/plugin-build/gradlew -p Nucleus/plugin-build :plugin:publishToMavenLocal \
            --no-configuration-cache --no-daemon

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install keyring cross-compile toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Package Linux (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :composeApp:packageGraalvmDeb \
            :composeApp:packageGraalvmRpm \
            :composeApp:packageGraalvmPacman \
            :composeApp:packageGraalvmTar \
            --no-daemon --stacktrace \
            -Papp.variant=${{ inputs.variant }} \
            -Papp.version=${{ inputs.version }} \
            -Papp.packageVersion=${{ inputs.package_version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-Linux-amd64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.deb
            desktop/composeApp/build/compose/binaries/**/*.rpm
            desktop/composeApp/build/compose/binaries/**/*.pacman
            desktop/composeApp/build/compose/binaries/**/*.pkg.tar.zst
            desktop/composeApp/build/compose/binaries/**/*.tar.gz
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
