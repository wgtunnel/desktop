name: package-windows

on:
  push:
  workflow_call:
    inputs:
      variant:
        description: "App variant (release or beta)"
        type: string
        required: true
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        required: true
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        required: true
      nucleus_ref:
        description: "wgtunnel/Nucleus ref (includeBuild ../Nucleus)"
        type: string
        required: false
        default: feat/linux-scripts
  workflow_dispatch:
    inputs:
      variant:
        description: "App variant"
        type: choice
        options:
          - release
          - beta
        default: release
      version:
        description: "Updater and display version (0.0.0 or 0.0.0-beta.1)"
        type: string
        default: "0.0.0-test"
      package_version:
        description: "Installer packageVersion MAJOR.MINOR.PATCH"
        type: string
        default: "0.0.0"
      nucleus_ref:
        description: "wgtunnel/Nucleus ref (includeBuild ../Nucleus)"
        type: string
        default: feat/linux-scripts

permissions:
  contents: read
  id-token: write

jobs:
  package:
    name: package-windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
          submodules: recursive

      - uses: actions/checkout@v4
        with:
          repository: wgtunnel/Nucleus
          ref: ${{ inputs.nucleus_ref || 'feat/linux-scripts' }}
          path: Nucleus

      - uses: ./Nucleus/.github/actions/setup-nucleus
        with:
          java-version: "25"
          setup-gradle: "true"
          setup-node: "true"
          graalvm: "true"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64

      - name: Verify Tools
        run: |
          gcc --version
          go version

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Package NSIS (GraalVM)
        working-directory: desktop
        env:
          WGTUNNEL_VARIANT: ${{ inputs.variant }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew :composeApp:packageGraalvmNsis --no-daemon --stacktrace "-Papp.variant=${{ inputs.variant || 'release' }}" "-Papp.version=${{ inputs.version || github.ref_name }}" "-Papp.packageVersion=${{ inputs.package_version || '0.0.0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-Windows-amd64
          if-no-files-found: error
          path: |
            desktop/composeApp/build/compose/binaries/**/*.exe
            desktop/composeApp/build/compose/binaries/**/*.yml
            desktop/composeApp/build/compose/binaries/**/*.blockmap
