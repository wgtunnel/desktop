name: publish-apt

on:
  workflow_call:
    inputs:
      channel:
        description: "Nucleus update channel (latest or beta). This is informational only, used in the commit message. wgtunnel/wgtunnel-beta are separate packages in the same stable apt distribution"
        type: string
        required: true
      version:
        description: "Version being published (0.0.0 or 0.0.0-beta.1)"
        type: string
        required: true
    secrets:
      GPG_SECRET_KEY:
        required: false
      GPG_PASS:
        required: false
  workflow_dispatch:
    inputs:
      channel:
        description: "Only used in the commit message when set"
        type: string
        required: false
      version:
        description: "Only used in the commit message when set"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: apt-repo-gh-pages
  cancel-in-progress: false

jobs:
  publish-apt:
    name: publish-apt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: desktop
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          name: release-assets-Linux-amd64
          path: artifacts

      - name: Checkout gh-pages (apt.wgtunnel.com root)
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import GPG signing key
        id: gpg
        env:
          GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASS }}
        run: |
          set -euo pipefail
          if printf '%s' "$GPG_SECRET_KEY" | grep -q -- '-----BEGIN PGP'; then
            printf '%s' "$GPG_SECRET_KEY" | gpg --batch --import
          else
            printf '%s' "$GPG_SECRET_KEY" | base64 -d | gpg --batch --import
          fi
          # reprepro signs without a prompt, so the agent holds the passphrase
          echo allow-preset-passphrase >> "$HOME/.gnupg/gpg-agent.conf"
          gpg-connect-agent reloadagent /bye >/dev/null
          PRESET="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
          gpg --batch --with-colons --with-keygrip --list-secret-keys \
            | awk -F: '$1 == "grp" { print $10 }' \
            | while read -r keygrip; do "$PRESET" --preset --passphrase "$GPG_PASS" "$keygrip"; done
          FINGERPRINT=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Configure apt repo (first run only)
        run: |
          set -euo pipefail
          mkdir -p gh-pages/conf
          cat > gh-pages/conf/distributions <<EOF
          Codename: stable
          Components: main
          Architectures: amd64
          SignWith: ${{ steps.gpg.outputs.fingerprint }}
          Description: WG Tunnel for Debian/Ubuntu (wgtunnel and wgtunnel-beta packages)
          EOF

      - name: Add .deb to repo
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          DEB_FILE=$(find artifacts -name '*.deb' | head -n1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb artifact found" >&2
            exit 1
          fi
          reprepro -b gh-pages includedeb stable "$DEB_FILE"

      - name: Publish signing key
        run: gpg --armor --export "${{ steps.gpg.outputs.fingerprint }}" > gh-pages/wgtunnel-archive-keyring.asc

      - name: Update landing page
        run: |
          cp desktop/packaging/apt/index.html gh-pages/index.html
          cp desktop/packaging/apt/site.css gh-pages/site.css
          cp desktop/packaging/apt/install.sh gh-pages/install.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conf dists pool wgtunnel-archive-keyring.asc index.html site.css install.sh
          if git diff --cached --quiet; then
            echo "No apt repo changes to publish"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "apt: refresh landing page"
          else
            git commit -m "apt: publish ${{ inputs.version }} (${{ inputs.channel }})"
          fi
          git push origin gh-pages
